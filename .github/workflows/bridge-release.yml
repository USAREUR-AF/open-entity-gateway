# A signed release of one vendor bridge (RELEASING.md).
#
# A tag `<bridge>-v<version>` (the bridge a directory under vendors/ listed in
# packaging/redistributable.txt, the version its pyproject.toml's) builds the bridge's
# archive for amd64 and arm64 on Ubuntu 24.04 with the system python3
# (packaging/build-archive.sh), checks each on its own architecture with no network
# (packaging/smoke-test.sh, which also installs it as root and checks the unit loads),
# writes SHA256SUMS, signs it keylessly with cosign (the signature names this
# workflow and the tag; no long-lived key), checks the signature as an installer will,
# and attaches the files to a GitHub Release of that tag:
#   vendor-bridges-<bridge>_<version>_linux_amd64.tar.gz, ..._linux_arm64.tar.gz,
#   SHA256SUMS, SHA256SUMS.sigstore.json
#
# Run by hand (workflow_dispatch, naming the bridge) it is a dry run: the same build,
# checks and signature at the branch's version, kept as a workflow artifact; nothing is
# published, also when it is run on a tag. A tag is released only from a commit on main.
name: bridge-release
on:
  push:
    tags: ["*-v[0-9]*"]
  workflow_dispatch:
    inputs:
      bridge:
        description: the bridge (a directory under vendors/)
        required: true
        default: picogrid-ecn
permissions:
  contents: read
concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.v.outputs.bridge }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: a tag is released only from a commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch -q --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main"; exit 1; }
      - name: the bridge and version, held to the tag, the bridge's pyproject.toml and the list of redistributable bridges
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          INPUT_BRIDGE: ${{ inputs.bridge }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ -z "$INPUT_BRIDGE" ]; then bridge="${TAG%-v*}"; else bridge="$INPUT_BRIDGE"; fi
          printf '%s\n' "$bridge" | grep -Eqx '[a-z0-9]+(-[a-z0-9]+)*' || { echo "not a bridge name: $bridge"; exit 1; }
          grep -qx "$bridge" packaging/redistributable.txt || { echo "$bridge is not in packaging/redistributable.txt"; exit 1; }
          v=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "vendors/$bridge/pyproject.toml")
          if [ "$REF_TYPE" = tag ] && [ -z "$INPUT_BRIDGE" ]; then
            test "$TAG" = "$bridge-v$v" || { echo "tag $TAG, but vendors/$bridge/pyproject.toml has $v"; exit 1; }
          fi
          grep -qx "## $bridge $v" CHANGELOG.md || { echo "CHANGELOG.md has no section '## $bridge $v'"; exit 1; }
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the archive, with Ubuntu 24.04's own python3
        env:
          BRIDGE: ${{ needs.version.outputs.bridge }}
        run: |
          test "$(command -v python3)" = /usr/bin/python3
          /usr/bin/python3 --version
          bash packaging/build-archive.sh "$BRIDGE" dist
      - name: it runs, loads its bridge and SDK, installs, and its unit loads
        env:
          BRIDGE: ${{ needs.version.outputs.bridge }}
          V: ${{ needs.version.outputs.version }}
        run: bash packaging/smoke-test.sh "dist/vendor-bridges-${BRIDGE}_${V}_linux_${{ matrix.arch }}.tar.gz" --install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout first: it cleans the workspace, so the files come after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS over both archives
        env:
          BRIDGE: ${{ needs.version.outputs.bridge }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          test "$(ls | sort | tr '\n' ' ')" = "vendor-bridges-${BRIDGE}_${V}_linux_amd64.tar.gz vendor-bridges-${BRIDGE}_${V}_linux_arm64.tar.gz "
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # The signing config is pinned in the tree (Fulcio and a Rekor v1 log), so a change
      # to Sigstore's published one cannot move the signature to a log goatbuilder refuses.
      - name: sign SHA256SUMS, keyless
        run: |
          cosign sign-blob --yes --signing-config packaging/release/signing-config.json \
            --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: the signature verifies as an installer will check it
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bridge-release.yml@${{ github.ref }}
        run: |
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # goatbuilder reads a Sigstore bundle v0.3 with one hashedrekord 0.0.1 entry in a
      # Rekor v1 log, with its signed entry timestamp and inclusion proof; it refuses any
      # other shape. Refuse here, before anything is published.
      - name: the bundle is the shape goatbuilder reads
        run: |
          python3 -I - dist/SHA256SUMS.sigstore.json <<'PY'
          import json, sys
          b = json.load(open(sys.argv[1]))
          assert b["mediaType"] == "application/vnd.dev.sigstore.bundle.v0.3+json", b["mediaType"]
          vm = b["verificationMaterial"]
          assert "certificate" in vm, "no certificate"
          es = vm["tlogEntries"]
          assert len(es) == 1, f"{len(es)} log entries"
          e = es[0]
          assert e["kindVersion"] == {"kind": "hashedrekord", "version": "0.0.1"}, e["kindVersion"]
          assert e.get("inclusionPromise", {}).get("signedEntryTimestamp"), "no signed entry timestamp (a Rekor v2 log?)"
          assert e.get("inclusionProof", {}).get("checkpoint", {}).get("envelope"), "no inclusion proof checkpoint"
          print("bundle v0.3, hashedrekord 0.0.1, signed entry timestamp and inclusion proof present")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: dist
      - name: the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BRIDGE: ${{ needs.version.outputs.bridge }}
          V: ${{ needs.version.outputs.version }}
        run: |
          awk -v h="## $BRIDGE $V" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no section '## $BRIDGE $V'" >&2; exit 1; }
          printf '\nThe %s bridge %s for Ubuntu 24.04 (amd64, arm64; its system python3), with the shared core and every dependency: no network is needed where it is installed. SHA256SUMS is signed with cosign (keyless): SHA256SUMS.sigstore.json. Check, install and configure: RELEASING.md and the archive'"'"'s INSTALL.md.\n' "$BRIDGE" "$V" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --verify-tag --title "$BRIDGE bridge $V" --notes-file "$RUNNER_TEMP/notes.md"
