<svg class="viz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="Tracks on the goat fabric reach outside systems three ways. Systems that speak an open standard, such as TAK servers, SAPIENT controllers and ASTERIX consumers, are reached through goat-transformers and its transport adapters. Vendor systems reached through the vendor&#x27;s own software kit, such as Anduril Lattice and Picogrid ECN, are reached through this repository&#x27;s vendor bridges. Receivers that cannot join the mesh are reached through an octo-pod&#x27;s release gate and egress.">
<style>/* visualization default: role tokens for figures and pages. Generated by tokens.py; edit the spec, not this block. */
:root { --ink:#191c22; --quiet:#555c68; --rule:#dde1e6; --line:#878f9c; --paper:#ffffff; --panel:#f5f6f8; --accent:#0b5a72; --accent-soft:#e2f0f4; --on-accent:#ffffff; --good:#2a6a35; --good-bg:#e4f3e6; --warn:#875200; --warn-bg:#fcf0d7; --info:#285d9e; --info-bg:#e6eff9; --crit:#b0261d; --crit-bg:#fbeae8; --mute:#5a606a; --mute-bg:#efeeeb; --font:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; --mono:Menlo, Consolas, "Courier New", monospace; color-scheme: light; }
