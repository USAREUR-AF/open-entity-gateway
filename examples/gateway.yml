# An example configuration. Every address is a documentation address
# (RFC 5737); a real configuration names the destinations its owner chose
# and belongs with the deployment, not in this repository.
#
#     open-entity-gateway check --config examples/gateway.yml
#
# `check` reads the TLS files it names, so it fails until they exist.
mappings:
  - ../mappings

destinations:
  - name: tak-server
    adapter: cot
    transport: tcp
    address: "203.0.113.20:8089"
    tls:
      ca_file: /etc/open-entity-gateway/tak/ca.pem
      client_cert_file: /etc/open-entity-gateway/tak/gateway.pem
      client_key_file: /etc/open-entity-gateway/tak/gateway.key
      server_name: tak.example.org
    announce:
      uid: open-entity-gateway-1
      callsign: GATEWAY-1

  - name: tak-clients
    adapter: cot
    transport: udp
    address: "239.2.3.1:6969"
    ttl: 1
    interface: "192.0.2.15"
    topics: ["WX/Position"]

  - name: sapient-fusion
    adapter: sapient
    address: "198.51.100.7:5020"
    node_id: "7c6f3a52-1e0b-4f7d-8a39-5b2e9d4c1f60"

  - name: asterix-consumer
    adapter: asterix-cat062
    address: "198.51.100.62:8600"
    sac: 25
    sic: 4
