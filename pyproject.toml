[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "open-entity-gateway"
version = "0.1.0"
description = "Bridges between the goat fabric and vendor systems, one package per vendor."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "goat contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Ranges here; the exact versions CI installs are in requirements/*.txt.
dependencies = [
  "PyYAML>=6.0.2,<7",
  "cbor2>=5.6,<6",
]

[project.optional-dependencies]
# SAPIENT bindings are generated from the Dstl proto files by
# tools/fetch-sapient-proto.py; they need the protobuf runtime.
sapient = ["protobuf>=7.35,<8"]
zmq = ["pyzmq>=26,<28"]
zenoh = ["eclipse-zenoh==1.9.0"]

[project.scripts]
open-entity-gateway = "open_entity_gateway.cli:main"

[project.urls]
Source = "https://github.com/USAREUR-AF/open-entity-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/open_entity_gateway"]
# The SAPIENT bindings, generated by tools/fetch-sapient-proto.py and not
# committed, go into a package built after that tool has run.
artifacts = ["src/open_entity_gateway/adapters/sapient/_generated/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/open_entity_gateway/adapters/sapient/_generated/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: runs against a server started for the test (TAK server, Apex); skipped unless its address is given",
  "goat_differs(reason, params): fails on encoder goat-transformers for a recorded difference (tests/conftest.py, each_encoder)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/open_entity_gateway/adapters/sapient/_generated", "src/open_entity_gateway/_goat_transformers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "A", "S", "RUF"]
# B027: the adapter base class has optional hooks that do nothing by default.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"tools/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
exclude = ["_generated/", "_goat_transformers/"]

[[tool.mypy.overrides]]
module = ["cbor2", "zmq", "zenoh", "anduril", "anduril.*", "asterix4py", "xmlschema", "open_entity_gateway.adapters.sapient._generated.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["open_entity_gateway._goat_transformers.*"]
follow_imports = "skip"
ignore_errors = true
